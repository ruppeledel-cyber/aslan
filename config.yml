backend:
  name: github
  repo: REEMPLAZAR_USUARIO/aslan
  branch: main

media_folder: ""
public_folder: ""

collections:
  - name: site
    label: Página de Aslan
    files:
      - label: Datos de Aslan
        name: aslan
        file: content.json
        fields:
          - {label: Nombre, name: name, widget: string}
          - {label: Presentación, name: intro, widget: text}
          - {label: Pelaje, name: coat, widget: string}
          - {label: Descripción, name: description, widget: text}
          - {label: Fotos, name: photos, widget: list, field: {label: Foto, name: photo, widget: image}}
          - {label: WhatsApp, name: whatsapp, widget: string}
